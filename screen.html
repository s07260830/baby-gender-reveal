<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Reveal｜投影</title><link rel="stylesheet" href="style.css"><style>main{max-width:1200px}.hero h1{font-size:4rem}.team{font-size:1.4rem;min-height:250px}.team h3{font-size:2rem}.big{font-size:4rem}</style><main><header class="hero"><small>BABY GENDER REVEAL</small><h1>BOY or GIRL?</h1></header><div id="app" class="card center">等待連線…</div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="config.js"></script><script src="common.js"></script><script>
let game=defaultGame,players={};function render(){let r=game.round||0,p=game.phase||'lobby',q=QUESTIONS[r],h=`<h2>ROUND ${r+1} / 10</h2>`;if(p==='lobby')h='<h2>歡迎來到 Baby Gender Reveal！</h2><p>請掃描主持人提供的 QR Code 入場</p>';else if(p==='finish')h='<div class="big">🎉 IT’S A BOY! 💙</div>';else{h+=`<h2>${esc(q[0])}</h2>`;if(p==='question')h+='<p>請大家回答問題</p>';if(p==='team')h+='<p>請選擇男寶／女寶戰隊</p>';if(p==='roster'||p==='updated'){h+=renderTeams(players,r,p==='updated');let vals=Object.values(players).map(x=>p==='updated'?x.teams?.[r]?.after||x.teams?.[r]?.before:x.teams?.[r]?.before);let b=vals.filter(x=>x==='boy').length,g=vals.filter(x=>x==='girl').length;if(b+g)h+=`<div class="bar"><div style="width:${100*b/(b+g)}%"></div><div style="width:${100*g/(b+g)}%"></div></div>`;if(p==='updated')h+=`<p>🔄 換隊紀錄<br>${changed(players,r)}</p>`}if(p==='reveal')h+=`<div class="big">✨ ${esc(q[1+q[3]])} ✨</div>`;if(p==='switch')h+='<div class="big">🔄 現在可以重新站隊！</div>'}$('#app').innerHTML=h}if(checkConfig()){db.ref(`${room}/game`).on('value',s=>{game=s.val()||defaultGame;render()});db.ref(`${room}/players`).on('value',s=>{players=s.val()||{};render()})}
</script></html>
