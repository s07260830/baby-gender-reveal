<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Reveal｜主持人</title><link rel="stylesheet" href="style.css"><main><header class="hero"><h1>🎤 主持人控制台</h1></header><div id="app" class="card">載入中…</div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="config.js"></script><script>window.addEventListener("error",e=>{const a=document.getElementById("app");if(a&&(/載入中|初始化中/.test(a.textContent)))a.textContent="程式載入失敗："+(e.message||"請檢查網路及 Firebase 設定");});window.addEventListener("unhandledrejection",e=>{const a=document.getElementById("app");if(a&&(/載入中|初始化中/.test(a.textContent)))a.textContent="連線失敗："+(e.reason?.message||String(e.reason));});</script><script src="common.js"></script><script>
let game=defaultGame,players={};const flow=['question','team','roster','reveal','switch','updated'];let busy=false;
function render(){const u=auth.currentUser;if(!u){$('#app').innerHTML='<h2>主持人登入</h2><input id="email" type="email" placeholder="Firebase 管理員 Email"><input id="password" type="password" placeholder="密碼"><button id="login">登入</button><p id="err" class="error"></p>';$('#login').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('#email').value,$('#password').value)}catch(e){$('#err').textContent=e.message}};return}let r=game.round||0,phase=game.phase||'lobby',q=QUESTIONS[r];let html=`<p>已登入：${esc(u.email)} <button id="logout">登出</button></p><h2>第 ${r+1} / 10 題</h2><h3>${esc(q[0])}</h3><p>目前階段：<strong>${esc(phase)}</strong></p><p>已加入 ${Object.keys(players).length} 位玩家</p>`;
if(phase==='question')html+=`<p>已答題 ${Object.values(players).filter(p=>p.answers?.[r]!==undefined).length} 人</p>`;
if(phase==='team')html+=`<p>已選隊 ${Object.values(players).filter(p=>p.teams?.[r]?.before).length} 人</p>`;
if(phase==='roster'||phase==='updated')html+=renderTeams(players,r,phase==='updated');
if(phase==='reveal')html+=`<div class="big">答案：${esc(q[1+q[3]])}</div>`;
if(phase==='updated')html+=`<p>🔄 換隊名單：<br>${changed(players,r)}</p>`;
if(phase==='finish')html+='<h2>🎉 IT’S A BOY! 💙</h2>';
if(phase!=='finish')html+=`<button id="next">${phase==='lobby'?'開始第一題':phase==='question'?'截止答題，開放選隊':phase==='team'?'公布戰隊名單':phase==='roster'?(r===9?'準備揭曉性別':'公布正確答案'):phase==='reveal'?'開放換隊':phase==='switch'?'公布最新戰隊':'下一題'}</button>`;
html+='<hr><p><button id="reset">重設遊戲與清空所有賓客資料</button></p><small>注意：重設不可復原。投影畫面請開 screen.html。</small>';$('#app').innerHTML=html;$('#logout').onclick=()=>auth.signOut();if($('#next'))$('#next').onclick=next;$('#reset').onclick=async()=>{if(confirm('確定清空所有資料並重新開始？')){await db.ref(room).remove();await db.ref(`${room}/game`).set(defaultGame)}}}
async function next(){if(busy)return;busy=true;try{let r=game.round||0,p=game.phase||'lobby',nextState;if(p==='lobby')nextState={round:0,phase:'question'};else if(p==='roster'&&r===9)nextState={round:r,phase:'finish'};else if(p==='updated')nextState={round:r+1,phase:'question'};else nextState={round:r,phase:flow[flow.indexOf(p)+1]};if(nextState.phase==='updated'){const updates={};Object.entries(players).forEach(([id,pl])=>{if(!pl.teams?.[r]?.after&&pl.teams?.[r]?.before)updates[`players/${id}/teams/${r}/after`]=pl.teams[r].before});updates['game']=nextState;await db.ref(room).update(updates)}else await db.ref(`${room}/game`).set(nextState)}catch(e){alert(e.message)}finally{busy=false}}
if(checkConfig()){
  render();
  auth.onAuthStateChanged(u=>{
    render();
    if(u&&!window.hostListenersAttached){
      window.hostListenersAttached=true;
      const onError=e=>{const msg='資料庫讀取失敗：'+e.message;const el=document.getElementById('app');if(el){const p=document.createElement('p');p.className='error';p.textContent=msg;el.prepend(p)}};
      db.ref(`${room}/game`).on('value',s=>{game=s.val()||defaultGame;render()},onError);
      db.ref(`${room}/players`).on('value',s=>{players=s.val()||{};render()},onError);
    }
  },e=>{$('#app').textContent='登入服務初始化失敗：'+e.message});
}
</script></html>
